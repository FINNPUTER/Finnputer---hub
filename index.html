<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06080d">
<title>FINNPUTER Terminal — $FINNPUTER</title>
<meta property="og:title" content="$FINNPUTER — Hat stays on.">
<meta property="og:description" content="Live terminal. Play the arcade. Climb the board.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06080d; --panel:#0a0f17; --panel2:#0c1219;
    --line:rgba(120,165,145,.14); --line2:rgba(120,165,145,.22);
    --ink:#e8eef0; --dim:#7b8c94; --faint:#54636b;
    --green:#19e8a0; --red:#ff5470; --gold:#ffce6a;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --disp:'Space Grotesk',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--mono);
    line-height:1.5;overflow-x:hidden;position:relative;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 3px);
    mix-blend-mode:multiply;opacity:.5;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
    background:radial-gradient(120% 90% at 50% 0%,rgba(25,232,160,.06),transparent 55%),
               radial-gradient(140% 120% at 50% 100%,rgba(0,0,0,.55),transparent 60%);}
  .wrap{max-width:600px;margin:0 auto;padding:0 18px 56px;position:relative;z-index:2;}

  .bar{display:flex;align-items:center;justify-content:space-between;height:46px;
    border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;color:var(--dim);}
  .bar .brand{font-weight:500;color:var(--ink);}
  .bar .brand .s{color:var(--green);}
  .status{display:flex;align-items:center;gap:8px;text-transform:uppercase;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;}
  .status .upd{color:var(--faint);letter-spacing:.06em;}

  .hero{display:flex;gap:18px;align-items:center;padding:30px 0 22px;}
  .monitor{flex:none;width:96px;height:96px;border-radius:14px;border:1px solid var(--line2);
    background:radial-gradient(80% 80% at 50% 30%,rgba(25,232,160,.10),#070b11);
    display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 22px rgba(25,232,160,.10);}
  .monitor img{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(25,232,160,.35));}
  .id{min-width:0;}
  .id .sym{font-family:var(--disp);font-weight:700;font-size:clamp(26px,8vw,34px);letter-spacing:.01em;color:var(--ink);}
  .id .tag{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--green);margin-top:4px;}
  .pxrow{display:flex;align-items:baseline;gap:2px;margin-top:14px;}
  .px{font-weight:700;font-size:clamp(22px,7vw,30px);color:var(--ink);letter-spacing:-.01em;}
  .cursor{display:inline-block;width:9px;height:1.05em;background:var(--green);transform:translateY(2px);margin-left:5px;animation:blink 1.1s steps(1) infinite;}
  .chg{font-size:13px;font-weight:500;margin-top:6px;color:var(--dim);}
  .chg.up{color:var(--green);} .chg.down{color:var(--red);}

  .readout{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .cell{padding:13px 14px;border-right:1px solid var(--line);}
  .cell:last-child{border-right:none;}
  .cell .k{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
  .cell .v{display:block;font-size:16px;font-weight:700;color:var(--ink);margin-top:5px;letter-spacing:-.01em;}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:11px;
    text-decoration:none;font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.01em;transition:transform .12s,border-color .12s,background .12s;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--green);color:#04241a;}
  .btn.primary:hover{background:#2bf0ab;}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);}
  .btn.ghost:hover{border-color:var(--green);}
  .btn svg{width:15px;height:15px;}

  .block{margin-top:32px;}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    display:flex;align-items:center;gap:10px;margin-bottom:13px;}
  .eyebrow::before{content:"";width:14px;height:1px;background:var(--green);opacity:.7;}

  .screen{border:1px solid var(--line2);border-radius:13px;overflow:hidden;background:var(--panel);}
  .screen .label{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
  .chart{width:100%;aspect-ratio:4/3;background:var(--panel2);}
  .chart iframe{width:100%;height:100%;border:0;display:block;}

  .games{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .game{display:flex;flex-direction:column;justify-content:space-between;min-height:96px;text-decoration:none;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;transition:border-color .12s,transform .12s;}
  .game:hover{border-color:var(--green);transform:translateY(-2px);}
  .game .gn{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink);}
  .game .gd{font-size:11px;color:var(--dim);margin-top:4px;}
  .game .go{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-top:12px;}

  .board{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);}
  .row{display:flex;align-items:center;gap:13px;padding:12px 15px;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .rk{width:22px;text-align:right;color:var(--faint);font-weight:700;}
  .row:nth-child(1) .rk{color:var(--gold);}.row:nth-child(2) .rk{color:#c7d2d8;}.row:nth-child(3) .rk{color:#d99356;}
  .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:13px;}
  .sc{color:var(--green);font-weight:700;font-size:13px;}
  .empty{padding:22px 16px;text-align:center;color:var(--dim);font-size:12px;}

  .ca{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--panel);}
  .ca code{flex:1;min-width:0;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ca button{flex:none;background:transparent;color:var(--green);border:1px solid var(--line2);border-radius:8px;padding:7px 13px;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.06em;cursor:pointer;}
  .ca button:hover{border-color:var(--green);}

  .social{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
  .social a{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border:1px solid var(--line);border-radius:11px;text-decoration:none;color:var(--ink);font-size:12px;transition:border-color .12s;}
  .social a:hover{border-color:var(--green);}
  .social svg{width:15px;height:15px;opacity:.85;}

  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);text-align:center;color:var(--faint);font-size:11px;letter-spacing:.1em;}
  footer b{color:var(--green);font-weight:500;}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.dot,.cursor{animation:none}}
  @media (max-width:380px){.monitor{width:80px;height:80px}.monitor img{width:64px;height:64px}}

  .heroart{position:relative;margin:2px 0 18px;border-radius:14px;overflow:hidden;
    border:1px solid rgba(22,255,155,.18);box-shadow:0 0 40px rgba(0,0,0,.5);}
  .heroart img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;}
  .heroart::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(6,8,13,0) 52%,rgba(6,8,13,.9) 100%);}
</style>
</head>

function fmt(n){ n=Number(n)||0; if(n>=1e9)return '$'+(n/1e9).toFixed(2)+'B'; if(n>=1e6)return '$'+(n/1e6).toFixed(2)+'M'; if(n>=1e3)return '$'+(n/1e3).toFixed(1)+'K'; return '$'+n.toFixed(0); }
function fmtPrice(p){ p=Number(p); if(!p)return '$—'; if(p>=1)return '$'+p.toFixed(3); const s=p.toFixed(12).replace(/0+$/,''); return '$'+s; }
function stamp(){ document.getElementById('upd').textContent=new Date().toTimeString().slice(0,8); }

async function loadToken(){
  if(!CA||CA.indexOf('PASTE')===0) return;
  try{
    const r=await fetch('https://api.dexscreener.com/latest/dex/tokens/'+CA);
    const d=await r.json();
    if(!d.pairs||!d.pairs.length) return;
    const pair=d.pairs.slice().sort((a,b)=>(b.liquidity&&b.liquidity.usd||0)-(a.liquidity&&a.liquidity.usd||0))[0];
    document.getElementById('px').textContent=fmtPrice(pair.priceUsd);
    const ch=pair.priceChange&&pair.priceChange.h24, el=document.getElementById('ch24');
    if(ch!=null){ el.textContent=(ch>=0?'▲ +':'▼ ')+Number(ch).toFixed(1)+'%  ·  24h'; el.className='chg '+(ch>=0?'up':'down'); }
    document.getElementById('mc').textContent=fmt(pair.marketCap||pair.fdv);
    document.getElementById('lq').textContent=fmt(pair.liquidity&&pair.liquidity.usd);
    document.getElementById('vol').textContent=fmt(pair.volume&&pair.volume.h24);
    const ds='https://dexscreener.com/'+pair.chainId+'/'+pair.pairAddress;
    document.getElementById('buy').href=ds;
    if(!document.querySelector('#chartbox iframe'))
      document.getElementById('chartbox').innerHTML='<iframe src="'+ds+'?embed=1&theme=dark&trades=0&info=0" allow="clipboard-write"></iframe>';
    stamp();
  }catch(e){}
}
async function loadBoard(){
  if(!ARCADE_API) return;
  try{
    const r=await fetch(ARCADE_API.replace(/\/$/,'')+'/leaderboard?game=total&limit=10');
    const d=await r.json();
    if(!d.entries||!d.entries.length){ document.getElementById('board').innerHTML='<div class="empty">No scores yet. Be the first to post one.</div>'; return; }
    document.getElementById('board').innerHTML=d.entries.map((e,i)=>'<div class="row"><div class="rk">'+(i+1)+'</div><div class="nm">'+esc(e.name||e.username||'anon')+'</div><div class="sc">$'+Number(e.score).toLocaleString()+'</div></div>').join('');
  }catch(e){}
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
loadToken(); loadBoard(); setInterval(loadToken,30000);
</script>
